<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RinaVerse Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#08090e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input{font:inherit}
.top{position:sticky;top:0;z-index:5;background:#0c0e15f2;backdrop-filter:blur(15px);padding:12px 14px;border-bottom:1px solid #202536}
.row{display:flex;align-items:center;gap:10px}.logo{font-size:23px;font-weight:900;color:#ff4f91}.logo b{color:#fff}
.search{width:100%;margin-top:10px;padding:12px 15px;border-radius:24px;border:1px solid #292f41;background:#151823;color:#fff;outline:none}
.hero{padding:48px 18px 38px;background:radial-gradient(circle at 80% 25%,#632651,#11152a 42%,#08090e 78%);min-height:390px}
.pink{color:#ff6da6}.hero h1{font-size:42px;line-height:1.05;margin:10px 0 15px}.hero p{color:#b8becd;line-height:1.8}
.btn{border:0;border-radius:24px;padding:12px 18px;font-weight:800;color:#fff;min-height:45px}.primary{background:#ff4f91}.dark{background:#202536}
main{padding:10px 14px 45px}.head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 13px}.head h2{font-size:21px;margin:0}.head span{color:#ff6da6;font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px}.chip{white-space:nowrap;border:1px solid #292f41;background:#11141e;color:#c4c8d4;border-radius:20px;padding:9px 14px}.chip.active{background:#ff4f9120;color:#fff;border-color:#ff4f91}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.card{background:#11141c;border:1px solid #23283a;border-radius:12px;overflow:hidden;min-width:0}.poster{height:245px;background:#111;display:flex;align-items:flex-end;padding:11px;position:relative;overflow:hidden}.posterArt{position:absolute;inset:0;width:100%;height:100%;display:block}.poster>b{position:relative;z-index:2;text-shadow:0 2px 8px #000}.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000d)}.poster b{position:relative;z-index:1;font-size:15px}.info{padding:10px}.info b{font-size:14px}.meta{color:#8f96a8;font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rate{color:#ffc85c;font-size:11px;margin-top:7px}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:20;padding:12px;overflow:auto}.modal.show{display:block}.box{background:#111520;border:1px solid #30374b;border-radius:16px;margin-top:30px;overflow:hidden}.detailposter{height:220px;background:var(--g);display:flex;align-items:flex-end;padding:18px;font-size:25px;font-weight:900}.detail{padding:18px}.close{float:left;border:0;border-radius:50%;width:40px;height:40px;background:#252b3a;color:#fff;font-size:22px}.detail p{color:#b7bdca;line-height:1.8}.eps{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.ep{border:0;background:#242a3b;color:#fff;border-radius:7px;padding:9px 12px;min-width:42px}.watch{display:none;position:fixed;inset:0;background:#06070b;z-index:30;padding:18px}.watch.show{display:block}.screen{height:62vh;margin-top:25px;border:1px solid #292f40;border-radius:14px;background:radial-gradient(circle,#27223d,#0b0d12 65%);display:flex;align-items:center;justify-content:center;text-align:center}.play{font-size:55px}
.toast{position:fixed;bottom:18px;left:18px;right:18px;background:#1b2030;border:1px solid #343b50;border-radius:12px;padding:13px;text-align:center;display:none;z-index:40}
</style>
</head>
<body>
<header class="top">
 <div class="row"><div class="logo">Rina<b>Verse</b></div></div>
 <input id="search" class="search" placeholder="🔎 ابحث عن أنمي..." autocomplete="off">
</header>

<section class="hero">
 <div class="pink">✦ RINAVERSE</div>
 <h1>عالم الأنمي<br>في مكان واحد.</h1>
 <p>اضغط على أي أنمي لتفتح صفحته وتشوف الحلقات والتفاصيل.</p>
 <button class="btn primary" onclick="document.getElementById('anime').scrollIntoView()">استكشف الأنمي ↓</button>
</section>

<main>
<section id="anime">
 <div class="head"><h2>🔥 الأنميات</h2><span id="count"></span></div>
 <div class="chips" id="chips">
  <button class="chip active" data-g="الكل">الكل</button><button class="chip" data-g="أكشن">أكشن</button>
  <button class="chip" data-g="فانتازيا">فانتازيا</button><button class="chip" data-g="رياضة">رياضة</button>
  <button class="chip" data-g="كوميديا">كوميديا</button><button class="chip" data-g="دراما">دراما</button>
 </div>
 <div id="grid" class="grid" style="margin-top:14px"></div>
</section>
</main>

<div id="modal" class="modal"><div class="box"><div id="detail"></div></div></div>
<div id="watch" class="watch"><button class="btn dark" onclick="closeWatch()">← رجوع</button><div id="watchTitle" style="margin-top:18px;font-weight:800"></div><div class="screen"><div><div class="play">▶</div><b>مشغل تجريبي</b><p style="color:#999">مكان مشغل الحلقة لاحقًا</p></div></div></div>
<div id="toast" class="toast"></div>

<script>
const anime=[
["One Piece","مغامرة • أكشن","9.2",1150,"أكشن","linear-gradient(145deg,#6d2b38,#173151)"],
["Demon Slayer","أكشن • فانتازيا","9.0",63,"أكشن","linear-gradient(145deg,#2b5360,#3b1c43)"],
["Jujutsu Kaisen","أكشن • خارق","8.9",47,"أكشن","linear-gradient(145deg,#29325f,#572047)"],
["Attack on Titan","دراما • أكشن","9.3",89,"دراما","linear-gradient(145deg,#465331,#241d32)"],
["Solo Leveling","فانتازيا • أكشن","9.1",25,"فانتازيا","linear-gradient(145deg,#183a5c,#48215e)"],
["Blue Lock","رياضة • منافسة","8.7",38,"رياضة","linear-gradient(145deg,#10566c,#29204e)"],
["SPY x FAMILY","كوميديا • عائلة","8.8",37,"كوميديا","linear-gradient(145deg,#694629,#2e4a36)"],
["Haikyu!!","رياضة • دراما","8.9",85,"رياضة","linear-gradient(145deg,#674a29,#214d5c)"]
];
let genre="الكل";

const grid=document.getElementById("grid"),search=document.getElementById("search"),count=document.getElementById("count");
function render(){
 const q=search.value.trim().toLowerCase();
 const list=anime.filter(a=>(genre==="الكل"||a[4]===genre)&&(a[0]+" "+a[1]).toLowerCase().includes(q));
 count.textContent=list.length+" أعمال";
 grid.innerHTML=list.length?list.map(a=>card(a)).join(""):"<div style='grid-column:1/-1;text-align:center;color:#9298a8;padding:35px'>ما لقيت نتيجة 😅</div>";
}
function art(a){
 const i=anime.indexOf(a);
 const themes=[
  ["#090d1d","#ff304f","#56d8ff","#ffd166","Blade Runner"],
  ["#06243b","#ff9f43","#4cc9f0","#ffe66d","Sea Voyager"],
  ["#190d28","#ff4d6d","#9b5cff","#c7f9ff","Cursed Eclipse"],
  ["#1d120e","#ff7b00","#f2d06b","#fff2b2","Titanfall"],
  ["#071d27","#22d3ee","#8b5cf6","#d8f3ff","Neon Striker"],
  ["#061e24","#00e0b8","#ff6b35","#b8fff2","Night Hunter"],
  ["#20101a","#ff3d71","#f5c451","#ffe8a3","Street Kings"],
  ["#15102c","#7c5cff","#2dd4bf","#e4dcff","Skybound"]
 ];
 const [bg,accent,accent2,light,title]=themes[i%themes.length];
 const names=["Demon Slayer","One Piece","Jujutsu Kaisen","Attack on Titan","Solo Leveling","Blue Lock","SPY x FAMILY","Haikyu!!"];
 const tag=["BLADE OF DAWN","OCEAN OF DREAMS","ECLIPSE CURSE","LAST WALL","SHADOW RISE","NEON FIELD","SECRET HOUSE","SKY SPIKE"][i%8];
 const hair=["#171827","#111827","#252033","#3b2419","#121826","#071f25","#d8a85d","#b8b9ff"][i%8];
 const jacket=["#16243a","#7d241f","#241b3f","#33231d","#121f3a","#123b3a","#2a1e27","#1e2a4d"][i%8];
 const face=["#f1c2a7","#dca57d","#f2c7aa","#c99470","#d9a982","#efc3a3","#f0c8a7","#dcae8d"][i%8];
 const weapon=i%4===0
   ? `<path d="M90 425 L315 165" stroke="${light}" stroke-width="10" stroke-linecap="round"/><path d="M74 445 L104 415" stroke="${accent}" stroke-width="18" stroke-linecap="round"/>`
   : i%4===1
   ? `<path d="M292 430 Q335 350 315 280" fill="none" stroke="${accent2}" stroke-width="12"/><circle cx="310" cy="250" r="38" fill="none" stroke="${light}" stroke-width="5" opacity=".8"/>`
   : i%4===2
   ? `<path d="M80 390 Q205 300 320 390" fill="none" stroke="${accent}" stroke-width="14"/><path d="M110 370 L75 315 M290 370 L330 315" stroke="${light}" stroke-width="5"/>`
   : `<path d="M95 420 L205 220 L315 420" fill="none" stroke="${accent2}" stroke-width="12"/><path d="M205 220 L205 445" stroke="${light}" stroke-width="5"/>`;
 return `<svg class="posterArt" viewBox="0 0 400 560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${a[0]} original anime-inspired poster">
 <defs>
  <linearGradient id="bg${i}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${bg}"/><stop offset=".58" stop-color="#11101d"/><stop offset="1" stop-color="#05060a"/></linearGradient>
  <radialGradient id="glow${i}"><stop stop-color="${accent}" stop-opacity=".55"/><stop offset="1" stop-color="${accent}" stop-opacity="0"/></radialGradient>
  <linearGradient id="coat${i}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${jacket}"/><stop offset="1" stop-color="#05070c"/></linearGradient>
  <filter id="blur${i}"><feGaussianBlur stdDeviation="20"/></filter>
 </defs>
 <rect width="400" height="560" fill="url(#bg${i})"/>
 <circle cx="72" cy="112" r="125" fill="url(#glow${i})" filter="url(#blur${i})"/>
 <circle cx="330" cy="270" r="135" fill="${accent2}" opacity=".13" filter="url(#blur${i})"/>
 <g opacity=".42" stroke="${light}">
  <path d="M0 170 L130 60 M275 35 L400 130 M0 345 L120 255 M290 330 L400 245" stroke-width="2"/>
  <path d="M25 230 L85 170 M325 180 L380 125" stroke-width="5"/>
 </g>
 <g fill="${light}">
  <circle cx="42" cy="85" r="3"/><circle cx="350" cy="85" r="4"/><circle cx="70" cy="290" r="3"/>
  <circle cx="340" cy="340" r="3"/><circle cx="120" cy="70" r="2"/><circle cx="270" cy="115" r="2"/>
 </g>
 <path d="M0 440 Q80 350 160 410 T320 390 T400 430 V560 H0Z" fill="#03050a" opacity=".9"/>
 ${weapon}
 <g>
   <path d="M105 520 Q108 390 145 345 Q205 305 265 345 Q300 395 302 520Z" fill="url(#coat${i})" stroke="${accent2}" stroke-width="3"/>
   <path d="M150 355 Q205 410 255 355 L275 510 Q205 545 130 510Z" fill="#05070d" opacity=".7"/>
   <ellipse cx="205" cy="250" rx="72" ry="84" fill="${face}" stroke="${light}" stroke-width="3"/>
   <path d="M132 248 Q132 122 205 102 Q278 122 278 248 L250 207 Q205 166 158 207Z" fill="${hair}" stroke="${accent}" stroke-width="6"/>
   <path d="M146 214 Q205 170 264 214" fill="none" stroke="${accent2}" stroke-width="9" opacity=".9"/>
   <path d="M160 254 Q178 242 194 254 M216 254 Q232 242 250 254" fill="none" stroke="#222333" stroke-width="5" stroke-linecap="round"/>
   <circle cx="178" cy="254" r="4" fill="${accent}"/><circle cx="232" cy="254" r="4" fill="${accent}"/>
   <path d="M190 288 Q205 298 220 288" fill="none" stroke="#8d4f59" stroke-width="4" stroke-linecap="round"/>
   <path d="M158 340 L88 455 M252 340 L322 455" stroke="${accent}" stroke-width="16" stroke-linecap="round" opacity=".8"/>
 </g>
 <rect x="18" y="18" width="160" height="27" rx="13" fill="#03050acc" stroke="${light}" stroke-opacity=".45"/>
 <text x="31" y="36" fill="#fff" font-size="11" font-weight="800" letter-spacing="1.6">RINAVERSE ORIGINAL</text>
 <text x="22" y="492" fill="${light}" font-size="11" font-weight="800" letter-spacing="2.3">${tag}</text>
 <text x="22" y="525" fill="#fff" font-size="25" font-weight="900">${a[0]}</text>
 <text x="22" y="548" fill="${accent2}" font-size="10" font-weight="700" letter-spacing="1.4">${title} • ANIME POSTER</text>
 </svg>`;
}
function card(a){
 const i=anime.indexOf(a);
 return `<button class="card" style="padding:0;text-align:right;color:#fff;width:100%;border:1px solid #23283a" onclick="openAnime(${i})">
 <div class="poster">${art(a)}<b>${a[0]}</b></div>
 <div class="info"><b>${a[0]}</b><div class="meta">${a[1]}</div><div class="rate">★ ${a[2]} • ${a[3]} حلقة</div></div></button>`;
}
function openAnime(i){
 const a=anime[i];
 document.getElementById("detail").innerHTML=`<div class="detailposter" style="--g:${a[5]}">${a[0]}</div>
 <div class="detail"><button class="close" onclick="closeModal()">×</button>
 <div class="pink">ANIME DETAILS</div><h2>${a[0]}</h2><div class="rate">★ ${a[2]} • ${a[3]} حلقة</div>
 <p>أنمي من تصنيف ${a[1]}. اختر رقم الحلقة لتجربة صفحة المشاهدة.</p><b>الحلقات</b>
 <div class="eps">${Array.from({length:Math.min(12,a[3])},(_,n)=>`<button class="ep" onclick="watch('${a[0]}',${n+1})">${n+1}</button>`).join("")}</div>
 <button class="btn primary" style="margin-top:16px" onclick="toast('♥ تمت الإضافة للمفضلة')">♡ المفضلة</button></div>`;
 document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function watch(name,n){closeModal();document.getElementById("watchTitle").textContent=name+" — الحلقة "+n;document.getElementById("watch").classList.add("show")}
function closeWatch(){document.getElementById("watch").classList.remove("show")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1600)}
search.addEventListener("input",render);
document.getElementById("chips").addEventListener("click",e=>{if(!e.target.dataset.g)return;genre=e.target.dataset.g;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));e.target.classList.add("active");render()});
render();
</script>
</body>
</html>
